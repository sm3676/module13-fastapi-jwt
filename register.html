<!DOCTYPE html>
<html>
<body>
<h2>Register</h2>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>

<p id="msg"></p>

<script>
async function register() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if (password.length < 6) {
        document.getElementById("msg").innerText = "Password too short";
        return;
    }

    let res = await fetch("http://127.0.0.1:8000/users/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({email, password})
    });

    let data = await res.json();

    if (res.status === 200) {
        localStorage.setItem("token", data.access_token);
        document.getElementById("msg").innerText = "Registered successfully";
    } else {
        document.getElementById("msg").innerText = data.detail;
    }
}
</script>
</body>
</html>
